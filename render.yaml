services:
  - type: web
    name: quidditch-amigos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: ADMIN_PASSWORD
        sync: false   # Render te pedirá escribirla al crear el servicio
      - key: CAPITAN_PASSWORD
        sync: false   # clave de capitanes: solo sirve para crear y dirigir entrenamientos
