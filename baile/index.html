<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baile de Navidad</title>
<meta name="theme-color" content="#0a1128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
<script src="config.js"></script>
<style>
:root{
  --noche:#0a1128; --noche2:#131f45; --tinta:#eef3fb; --suave:#a7b6d1; --tenue:#7586a6;
  --oro:#e6c77a; --oro2:#b8923f; --hielo:#cfe0f7; --rosa:#f0a6bd; --rojo:#ef8a8a; --verde:#8fd9b0;
  --borde:rgba(190,205,230,.18); --tarjeta:rgba(255,255,255,.055); --tarjeta2:rgba(255,255,255,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh; color:var(--tinta); font:16px/1.5 Nunito,system-ui,sans-serif;
  background:#070c1d radial-gradient(120% 70% at 50% 0%,#22356e 0%,#111c40 45%,#070c1d 100%) fixed;
}
#nieve{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#nieve i{position:absolute;top:-12px;color:#fff;opacity:.55;font-style:normal;animation:caer linear infinite}
@keyframes caer{to{transform:translate3d(var(--dx),110vh,0) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#nieve{display:none}*{animation:none!important;transition:none!important}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 90px}
h1,h2,h3{font-family:Cinzel,serif;font-weight:700;margin:0;letter-spacing:.02em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:.4em 0}
.titulo{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,9vw,2.9rem);line-height:1.05;text-align:center;
  background:linear-gradient(180deg,#fff7df,#e6c77a 55%,#b8923f);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(230,199,122,.15)}
.sub{text-align:center;color:var(--hielo);font-family:Cinzel,serif;letter-spacing:.18em;font-size:.82rem;text-transform:uppercase}
.suave{color:var(--suave)} .tenue{color:var(--tenue);font-size:.88rem} .centro{text-align:center}
.tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:20px;padding:18px;margin:14px 0;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tarjeta.oro{border-color:rgba(230,199,122,.55);box-shadow:0 0 0 1px rgba(230,199,122,.15),0 10px 40px rgba(230,199,122,.08)}
.orla{display:flex;align-items:center;gap:10px;color:var(--oro);margin:14px 0 6px;font-family:Cinzel,serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
.orla:before,.orla:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(230,199,122,.6),transparent)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:800;
  font-size:1rem;color:#241a05;background:linear-gradient(180deg,#f4dc9c,#d9b25c);box-shadow:0 6px 20px rgba(230,199,122,.25),inset 0 1px 0 #fff6d6}
.btn:disabled{opacity:.45;cursor:default}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 18px;border-radius:14px;font-weight:700;
  border:1px solid rgba(207,224,247,.4);color:var(--hielo);background:rgba(207,224,247,.06)}
.btn3{padding:8px 12px;border-radius:10px;font-weight:700;font-size:.9rem;color:var(--suave);border:1px solid var(--borde)}
.btn3.peligro{color:var(--rojo);border-color:rgba(239,138,138,.35)}
.enlace{color:var(--hielo);text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:6px 0}
.fila{display:flex;gap:10px} .fila>*{flex:1}
.pila>*+*{margin-top:10px}
label.campo{display:block;margin:12px 0 4px;font-weight:700;color:var(--hielo);font-size:.92rem}
input[type=text],input[type=password],input[type=tel],textarea,select{width:100%;font:inherit;color:var(--tinta);background:rgba(4,8,22,.55);
  border:1px solid var(--borde);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--oro)}
textarea{resize:vertical;min-height:70px}
select option{background:#0d1633}
.pin{letter-spacing:.6em;text-align:center;font-size:1.4rem;font-weight:800}
.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opcion{padding:12px 10px;border-radius:14px;border:1px solid var(--borde);background:var(--tarjeta);font-weight:700;text-align:center;line-height:1.25}
.opcion .e{display:block;font-size:1.6rem;margin-bottom:2px}
.opcion[aria-pressed=true]{border-color:var(--oro);background:rgba(230,199,122,.14);box-shadow:inset 0 0 0 1px var(--oro)}
.casa-Gryffindor[aria-pressed=true]{border-color:#e0574f;background:rgba(174,0,1,.28);box-shadow:inset 0 0 0 1px #e0574f}
.casa-Slytherin[aria-pressed=true]{border-color:#4fae74;background:rgba(26,71,42,.45);box-shadow:inset 0 0 0 1px #4fae74}
.casa-Ravenclaw[aria-pressed=true]{border-color:#6f8ee8;background:rgba(14,26,64,.7);box-shadow:inset 0 0 0 1px #6f8ee8}
.casa-Hufflepuff[aria-pressed=true]{border-color:#ecb939;background:rgba(236,185,57,.18);box-shadow:inset 0 0 0 1px #ecb939}
.insignia{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:800;border:1px solid var(--borde)}
.i-Gryffindor{background:rgba(174,0,1,.35);border-color:#c0392b;color:#ffd7a8}
.i-Slytherin{background:rgba(26,71,42,.6);border-color:#3d8b5c;color:#d5f0dc}
.i-Ravenclaw{background:rgba(14,26,64,.8);border-color:#5470c6;color:#d6e0ff}
.i-Hufflepuff{background:rgba(236,185,57,.25);border-color:#ecb939;color:#fff0c4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--borde);background:var(--tarjeta);font-size:.9rem;font-weight:600}
.chip[aria-pressed=true]{background:linear-gradient(180deg,#f4dc9c,#d9b25c);color:#241a05;border-color:transparent}
.chip.comun{background:rgba(240,166,189,.16);border-color:rgba(240,166,189,.5);color:#ffe3ec}
.chip.fijo{cursor:default}
.cat{border:1px solid var(--borde);border-radius:16px;margin:8px 0;background:rgba(255,255,255,.03)}
.cat>summary{list-style:none;padding:13px 14px;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{margin-left:auto;font-size:.8rem;color:var(--oro);font-weight:800}
.cat>summary:after{content:"▾";color:var(--tenue);margin-left:6px}
.cat[open]>summary:after{content:"▴"}
.cat .cuerpo{padding:0 14px 14px}
.otro{display:flex;gap:8px;margin-top:10px} .otro input{padding:9px 12px}
.otro button{white-space:nowrap}
.fotos-ed{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ranura{aspect-ratio:3/4;border-radius:16px;border:1.5px dashed rgba(207,224,247,.35);display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:var(--suave);background:rgba(255,255,255,.03);position:relative;overflow:hidden}
.ranura img{width:100%;height:100%;object-fit:cover}
.ranura .quitar{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:1rem;line-height:28px}
.carrusel{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:#0b1430}
.carrusel .pistas{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.carrusel .pistas::-webkit-scrollbar{display:none}
.carrusel img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.carrusel .puntos{position:absolute;top:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}
.carrusel .puntos b{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.carrusel .puntos b.on{background:#fff}
.carrusel .pie{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(5,9,25,.92))}
.carrusel .pie h2{font-size:1.6rem}
.carrusel .vacia{display:flex;height:100%;align-items:center;justify-content:center;font-size:4rem;color:var(--tenue)}
.cabecera{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mini{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--oro);background:#14214a;display:flex;align-items:center;justify-content:center;font-weight:800}
.cabecera .quien{flex:1;min-width:0}
.cabecera .quien b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contador{display:flex;justify-content:center;gap:10px;margin:14px 0}
.contador div{min-width:64px;padding:10px 6px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde);text-align:center}
.contador b{display:block;font-family:Cinzel,serif;font-size:1.5rem;color:var(--oro);line-height:1.1}
.contador span{font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.08em}
.cifras{display:flex;gap:10px}
.cifras div{flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:var(--tarjeta);border:1px solid var(--borde)}
.cifras b{display:block;font-size:1.6rem;font-family:Cinzel,serif;color:var(--hielo)}
.cifras span{font-size:.8rem;color:var(--suave)}
.pasos{counter-reset:p;list-style:none;padding:0;margin:0}
.pasos li{counter-increment:p;display:flex;gap:12px;margin:12px 0;align-items:flex-start}
.pasos li:before{content:counter(p);flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Cinzel,serif;font-weight:700;color:#241a05;background:var(--oro)}
.progreso{display:flex;gap:5px;margin:4px 0 16px}
.progreso b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.progreso b.on{background:var(--oro)}
.sombrero{font-size:4.2rem;display:block;text-align:center;animation:flotar 3s ease-in-out infinite}
@keyframes flotar{50%{transform:translateY(-8px) rotate(-4deg)}}
.regalo-grande{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:rgba(240,166,189,.1);border:1px solid rgba(240,166,189,.35)}
.regalo-grande .e{font-size:2.6rem;width:64px;height:64px;flex:0 0 64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.02));box-shadow:0 0 24px rgba(240,166,189,.25)}
.nota{font-style:italic;color:#ffe9f0}
.regalos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.regalo{padding:10px 6px;border-radius:14px;border:1px solid var(--borde);background:var(--tarjeta);text-align:center;font-size:.78rem;font-weight:700;line-height:1.2}
.regalo .e{display:block;font-size:2rem;margin-bottom:4px}
.regalo[aria-pressed=true]{border-color:var(--rosa);background:rgba(240,166,189,.16);box-shadow:inset 0 0 0 1px var(--rosa)}
.frases{display:flex;flex-direction:column;gap:6px}
.frase{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);font-size:.93rem}
.frase[aria-pressed=true]{border-color:var(--oro);background:rgba(230,199,122,.12)}
.carta{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--borde)}
.carta:first-child{border-top:0}
.carta .e{font-size:2rem;flex:0 0 44px;text-align:center}
.nuevo{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--rosa);color:#3b0e1c;font-size:.7rem;font-weight:800;vertical-align:middle}
.aviso{display:flex;gap:12px;align-items:flex-start}
.aviso .e{font-size:1.8rem}
.cerrar{margin-left:auto;color:var(--tenue);font-size:1.3rem;line-height:1;padding:2px 6px}
.velo{position:fixed;inset:0;z-index:20;background:rgba(3,6,18,.78);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.hoja{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0f1a3b;border:1px solid var(--borde);border-bottom:0;
  border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.velo{align-items:center}.hoja{border-radius:22px;border-bottom:1px solid var(--borde)}}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:-6px auto 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;
  background:#f4e6c0;color:#2a1d04;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.mal{background:#ffd2d2;color:#4b0c0c}
.fiesta{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle,rgba(40,56,110,.95),rgba(5,9,25,.97))}
.fiesta .dentro{max-width:420px;text-align:center}
.fiesta .duo{display:flex;justify-content:center;margin:18px 0}
.fiesta .duo>*{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--oro);background:#14214a;
  display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.fiesta .duo>*+*{margin-left:-18px}
.confeti{position:fixed;top:-20px;z-index:31;pointer-events:none;animation:caer 3.2s ease-in forwards}
.cargando{text-align:center;padding:60px 0;color:var(--suave)}
.cargando:before{content:"❄";display:block;font-size:2.4rem;animation:girar 2.4s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.admin-persona{padding:10px 0;border-top:1px solid var(--borde)}
.admin-persona .acc{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.estado{font-size:.78rem;font-weight:800;padding:1px 8px;border-radius:99px}
.e-busca{background:rgba(207,224,247,.14);color:var(--hielo)} .e-tiene{background:rgba(230,199,122,.16);color:var(--oro)} .e-pareja{background:rgba(143,217,176,.16);color:var(--verde)}
.interruptor{display:flex;align-items:center;gap:10px;font-weight:700}
.interruptor input{width:22px;height:22px;accent-color:#d9b25c}
</style>
</head>

const CFG = window.BAILE_CONFIG || {};
async function api(p) {
  const headers = { 'content-type': 'application/json', apikey: CFG.key };
  if (!String(CFG.key).startsWith('sb_')) headers.Authorization = 'Bearer ' + CFG.key;
  let r;
  try {
    r = await fetch(String(CFG.url).replace(/\/+$/, '') + '/rest/v1/rpc/baile', { method: 'POST', headers, body: JSON.stringify({ p }) });
  } catch (e) { throw new Error('Sin conexión. Revisa tu internet e inténtalo de nuevo.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || 'Algo salió mal. Inténtalo de nuevo.');
  if (j && j.error === 'sesion') { salir(true); throw new Error('Tu sesión terminó. Vuelve a entrar.'); }
  return j;
}
const S = { token: leer('baile_token'), estado: null, fotos: {}, timer: null };

async function fotosDe(persona) {
  if (!persona || !persona.fotos_n) return [];
  const c = S.fotos[persona.id];
  if (c && c.ver === persona.fotos_ver) return c.lista;
  const lista = await api({ accion: 'fotos', token: S.token, persona: persona.id });
  S.fotos[persona.id] = { ver: persona.fotos_ver, lista };
  return lista;
}
async function accion(p, msgOk) {
  const e = await api({ ...p, token: S.token });
  if (e && e.yo) S.estado = e;
  if (msgOk) toast(msgOk);
  return e;
}
function salir(silencio) {
  if (S.token && !silencio) api({ accion: 'salir', token: S.token }).catch(() => {});
  S.token = null; S.estado = null; S.fotos = {}; guardar('baile_token', null);
  location.hash = ''; portada();
}

    cont.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {

// Editor de fotos (máx. 3), se comprimen en el celular antes de subir
async function comprimir(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.82, 0.72, 0.62, 0.5, 0.4]) { const d = c.toDataURL('image/jpeg', q); if (d.length < 450000) return d; }
    throw new Error();
  } catch (e) { throw new Error('No pudimos leer esa foto. Prueba con otra (JPG o PNG).'); }
  finally { URL.revokeObjectURL(url); }
}
function editorFotos(cont, fotos, alCambiar) {

    cont.innerHTML = `<div class="fotos-ed">${[0, 1, 2].map((i) => fotos[i]

      : `<label class="ranura" style="cursor:pointer"><input type="file" accept="image/*" hidden>＋</label>`).join('')}</div>`;
    cont.querySelectorAll('.quitar').forEach((b) => b.addEventListener('click', () => { fotos.splice(+b.dataset.i, 1); pintar(); alCambiar(fotos); }));
    cont.querySelectorAll('input[type=file]').forEach((inp) => inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      try { fotos.push(await comprimir(f)); pintar(); alCambiar(fotos); } catch (e) { toast(e.message, true); }
    }));
  }
  pintar();
}

      c.innerHTML = `<h2>Sobre ti</h2>
        <label class="campo">Soy…</label><div class="opciones" id="soy">${botonesOpcion(SOY, R.soy)}</div>
        <label class="campo">Me gustaría ir al baile…</label><div class="opciones" id="voy">${botonesOpcion(VOY, R.voy_con)}</div>
        <p class="tenue">El Sombrero solo te presentará a personas con las que los dos se sientan a gusto.</p>
        <label class="campo" for="f">Una frase sobre ti (opcional)</label>
        <textarea id="f" maxlength="120" placeholder="Ej.: Bailo fatal pero me río mucho 😄">${esc(R.frase)}</textarea>`;
      activarOpciones($('#soy', c), (v) => (R.soy = v));
      activarOpciones($('#voy', c), (v) => (R.voy_con = v));
      $('#f', c).addEventListener('input', (e) => (R.frase = e.target.value));
    },
    pareja(c) {
      c.innerHTML = `<h2>¿Ya tienes pareja para el baile?</h2>
        <div class="opciones" id="est" style="grid-template-columns:1fr;margin-top:12px">
          <button type="button" class="opcion" data-v="busca" aria-pressed="${R.estado === 'busca'}"><span class="e">🎩</span>Todavía no: que el Sombrero me ayude</button>
          <button type="button" class="opcion" data-v="tiene" aria-pressed="${R.estado === 'tiene'}"><span class="e">💃</span>Sí, ya tengo con quién ir</button>
        </div>
        <div id="elige" style="display:${R.estado === 'tiene' ? 'block' : 'none'}">
          <label class="campo" for="pj">¿Con quién vas?</label>
          <select id="pj"><option value="">Cargando…</option></select>
          <p class="tenue">Le pediremos que lo confirme. Si todavía no se registra, déjalo en blanco y la eliges después.</p>
        </div>`;
      activarOpciones($('#est', c), (v) => { R.estado = v; $('#elige', c).style.display = v === 'tiene' ? 'block' : 'none'; });
      api({ accion: 'nombres_libres' }).then((l) => {
        const s = $('#pj', c); if (!s) return;
        s.innerHTML = `<option value="">— Todavía no se registra —</option>` + l.map((p) => `<option value="${p.id}" ${String(p.id) === String(R.pareja_id) ? 'selected' : ''}>${esc(p.nombre)} · ${esc(p.casa)}</option>`).join('');
        s.addEventListener('change', () => (R.pareja_id = s.value));
      }).catch(() => {});
    },
    fotos(c) {
      c.innerHTML = `<h2>Tus fotos</h2>
        <p class="suave">${busca() ? 'Sube <b>de 1 a 3 fotos</b>. Solo las verá la persona que el Sombrero te presente.' : 'Opcional: solo las verá tu pareja.'}</p>
        <div id="fe" style="margin-top:12px"></div>`;
      editorFotos($('#fe', c), R.fotos, () => {});
    },
    intereses(c) {
      c.innerHTML = `<h2>Lo que te gusta</h2>
        <p class="suave">${busca() ? `Elige <b>al menos ${MIN_INTERESES}</b>. Con esto el Sombrero encuentra a la persona con la que más coincides.` : 'Opcional, pero es divertido: verás en qué coinciden tu pareja y tú.'}</p>
        <p class="tenue" id="cuenta-int"></p>
        <div id="ei"></div>`;
      const cuenta = () => ($('#cuenta-int', c).textContent = R.intereses.length ? `Llevas ${R.intereses.length} ✓` : '');
      editorIntereses($('#ei', c), R.intereses, (l) => { R.intereses = l; cuenta(); });
      cuenta();
    },
  };
  function seguir() {
    const id = PASOS[paso];
    const mal = (m) => { toast(m, true); return false; };
    const ok = {
      cuenta: () => R.nombre.trim().length < 2 ? mal('Escribe tu nombre') : !/^\d{4}$/.test(R.pin) ? mal('El PIN son 4 números')
        : R.pin !== R.pin2 ? mal('Los dos PIN no coinciden') : !R.casa ? mal('Elige tu casa') : true,
      sobre: () => !R.soy ? mal('Dinos cómo te identificas') : !R.voy_con ? mal('Dinos con quién te gustaría ir') : true,
      pareja: () => !R.estado ? mal('Elige una opción') : true,
      fotos: () => busca() && !R.fotos.length ? mal('Sube al menos una foto para que el Sombrero pueda presentarte') : true,
      intereses: () => busca() && R.intereses.length < MIN_INTERESES ? mal(`Elige al menos ${MIN_INTERESES} cosas que te gusten`) : true,
    }[id]();
    if (!ok) return;
    if (paso < PASOS.length - 1) { paso++; pintar(); } else enviar();
  }
  async function enviar() {
    const btn = $('#seguir'); btn.disabled = true; btn.textContent = 'Preparando tu invitación…';
    try {
      const r = await api({ accion: 'registrar', ...R, nombre: R.nombre.trim() });
      S.token = r.token; guardar('baile_token', r.token); S.estado = r.estado;
      toast('¡Bienvenid@ al Baile de Navidad! ❄️'); inicio();
    } catch (e) {
      toast(e.message, true); btn.disabled = false; btn.textContent = '🎩 ¡Listo, entrar al baile!';
      if (/nombre/i.test(e.message)) { paso = 0; pintar(); }
    }
  }
  pintar();
}

// ====================================================================== Inicio (cuando ya entraste)
function pararSondeo() { clearInterval(S.timer); S.timer = null; }
function sondear() {
  pararSondeo();
  S.timer = setInterval(async () => {
    if (document.hidden || document.querySelector('.velo, .fiesta')) return;
    try { const antes = JSON.stringify(S.estado); await accion({ accion: 'estado' }); if (JSON.stringify(S.estado) !== antes) pintarInicio(); } catch (e) {}
  }, 20000);
}
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && S.timer && S.token) { try { await accion({ accion: 'estado' }); pintarInicio(); } catch (e) {} }
});

async function inicio() {
  location.hash = '';
  if (!S.estado) {
    app.innerHTML = `<div class="cargando">Abriendo el Gran Comedor…</div>`;
    try { await accion({ accion: 'estado' }); } catch (e) { if (!S.token) return; app.innerHTML = `<div class="tarjeta"><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Reintentar</button></div>`; return; }
  }
  pintarInicio(); sondear();
}

function pintarInicio() {
  const E = S.estado; if (!E) return;
  const yo = E.yo;
  const sinLeer = E.lechuzas.filter((l) => !l.leida && !l.cerrada).length;
  let h = `
    <div class="cabecera">
      <div class="mini" id="mifoto">${casa(yo.casa).e}</div>
      <div class="quien"><b>${esc(yo.nombre)}</b>${insignia(yo.casa)}</div>
      <button class="btn3" id="perfil">Mi perfil</button>
      <button class="btn3" id="salir" aria-label="Salir">Salir</button>
    </div>`;

  // Avisos
  for (const a of E.avisos) {
    let e = '💫', t = '', d = '';
    if (a.tipo === 'no') { t = 'Esta vez la magia no conectó'; d = '¡Sorry, piña! No pasa nada: el Sombrero ya te está buscando a alguien más.'; }
    else if (a.tipo === 'caducada') { e = '⌛'; t = 'Se acabó el tiempo'; d = a.mi_resp ? 'La otra persona no respondió a tiempo. El Sombrero te buscará otra opción.' : 'No respondiste a tiempo y la propuesta caducó. Puede que vuelva más adelante.'; }
    else if (a.tipo === 'cancelada') { e = '🎩'; t = 'El Sombrero cambió de planes'; d = 'La propuesta anterior ya no está disponible. Pronto tendrás otra.'; }
    else if (a.tipo === 'solicitud_rechazada') { e = '🤔'; t = `${a.nombre} no confirmó que van juntos`; d = 'Puedes elegir a otra persona o dejar que el Sombrero te ayude.'; }
    h += `<div class="tarjeta aviso"><span class="e">${e}</span><div><h3>${esc(t)}</h3><p class="suave">${esc(d)}</p></div>
      <button class="cerrar" data-aviso="${esc(a.tipo)}" data-id="${a.id}" aria-label="Cerrar">×</button></div>`;
  }

  // Solicitudes recibidas ("X dice que vais juntos")
  for (const s of E.solicitudes) {
    h += `<div class="tarjeta oro"><h3>💃 ${esc(s.persona.nombre)} dice que van juntos al baile</h3>
      <p class="suave">${insignia(s.persona.casa)} ¿Es verdad?</p>
      <div class="fila" style="margin-top:10px"><button class="btn" data-sol="${s.id}" data-acepta="1">¡Sí, confirmo!</button>
      <button class="btn2" data-sol="${s.id}" data-acepta="0">No es así</button></div></div>`;
  }

  if (E.pareja) h += bloquePareja(E);
  else if (yo.estado === 'tiene') h += bloqueTiene(E);
  else h += bloqueBusca(E);

  h += `<p class="tenue centro" style="margin-top:24px">${E.resumen.parejas} ${E.resumen.parejas === 1 ? 'pareja formada' : 'parejas formadas'} · ${E.resumen.buscando} buscando pareja</p>`;
  app.innerHTML = h;

  // Eventos
  $('#perfil').addEventListener('click', perfil);
  $('#salir').addEventListener('click', () => { if (confirm('¿Cerrar sesión en este celular?')) salir(); });
  fotosDe(yo).then((l) => { if (l[0] && $('#mifoto')) $('#mifoto').outerHTML = `<img class="mini" id="mifoto" src="${l[0]}" alt="">`; }).catch(() => {});
  app.querySelectorAll('[data-aviso]').forEach((b) => b.addEventListener('click', async () => {
    b.closest('.tarjeta').remove();
    try { await accion({ accion: 'visto', tipo: b.dataset.aviso, id: +b.dataset.id }); } catch (e) {}
  }));
  app.querySelectorAll('[data-sol]').forEach((b) => b.addEventListener('click', async () => {
    const acepta = b.dataset.acepta === '1';
    if (!acepta && !confirm('¿Seguro que no van juntos?')) return;
    try { await accion({ accion: 'responder_solicitud', id: +b.dataset.sol, acepta }); pintarInicio(); } catch (e) { toast(e.message, true); }
  }));
  const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener('click', fn); };
  on('#invitar', invitar);
  on('#rechazar', rechazar);
  on('#lechuza', mandarLechuza);
  on('#abrir-buzon', abrirBuzon);
  on('#ya-tengo', () => elegirMiPareja());
  on('#cambiar-pareja', () => elegirMiPareja());
  on('#cancelar-sol', async () => { try { await accion({ accion: 'cancelar_solicitud' }, 'Solicitud cancelada'); pintarInicio(); } catch (e) { toast(e.message, true); } });
  on('#quiero-sombrero', async () => {
    try { await accion({ accion: 'modo', estado: 'busca' }, '🎩 El Sombrero ya te tiene en cuenta'); pintarInicio(); }
    catch (e) { toast(e.message, true); if (/foto/i.test(e.message)) perfil(); }
  });
  cuentaAtras($('#cuenta-baile'), E.cfg.baile);
  if (E.pareja && E.pareja.nueva) celebrar(E);
  if (sinLeer && $('#buzon')) $('#buzon').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function bloqueBusca(E) {
  const q = E.propuesta;
  if (q) {
    const p = q.persona;
    let h = `<div class="orla">🎩 El Sombrero ha elegido</div>`;
    if (q.su_regalo) {
      const r = regalo(q.su_regalo);
      h += `<div class="tarjeta oro"><h3>💌 ¡${esc(p.nombre)} te invitó al baile!</h3>
        <div class="regalo-grande" style="margin-top:10px"><span class="e">${r.e}</span><div><b>${esc(r.n)}</b>
        ${q.su_nota ? `<p class="nota">“${esc(q.su_nota)}”</p>` : `<p class="tenue">${esc(r.d)}</p>`}</div></div></div>`;
    }
    h += `<div class="tarjeta" style="padding:10px">${carrusel(p, p.frase ? `<p style="margin-top:6px">${esc(p.frase)}</p>` : '')}
      <div style="padding:12px 6px 4px">
        ${q.comunes.length ? `<h3>💞 Coinciden en ${q.comunes.length === 1 ? '1 cosa' : q.comunes.length + ' cosas'}</h3><div style="margin:8px 0 12px">${chipsIntereses(q.comunes, q.comunes)}</div>`
          : `<p class="suave">El Sombrero ve algo especial aquí, aunque todavía no coincidan en sus gustos 😉</p>`}
        ${p.intereses.filter((k) => !q.comunes.includes(k)).length ? `<details><summary class="enlace" style="cursor:pointer">Ver todo lo que le gusta</summary><div style="margin-top:8px">${chipsIntereses(p.intereses.filter((k) => !q.comunes.includes(k)))}</div></details>` : ''}
      </div></div>`;
    if (q.mi_resp) {
      const r = regalo(q.mi_regalo);
      h += `<div class="tarjeta centro"><div style="font-size:2.4rem">🦉</div><h3>Tu lechuza ya va volando</h3>
        <p class="suave">Le mandaste ${r.e} <b>${esc(r.n)}</b>${q.mi_nota ? ` con “${esc(q.mi_nota)}”` : ''}.</p>
        <p class="tenue">Esperando su respuesta… tiene hasta el ${esc(fecha(q.vence))}.</p></div>`;
    } else {
      h += `<div class="pila"><button class="btn" id="invitar">💌 ${q.su_regalo ? 'Aceptar y mandarle un regalo' : 'Invitar al baile con un regalo'}</button>
        <button class="btn2" id="rechazar">No, gracias</button></div>
        <p class="tenue centro" style="margin-top:8px">Tienes hasta el ${esc(fecha(q.vence))} para responder. ${q.su_regalo ? '' : 'Si los dos dicen que sí, ¡tienen pareja!'}</p>`;
    }
    return h;
  }
  const cerrado = new Date(E.cfg.cierre) < new Date(E.cfg.ahora);
  let h = `<div class="tarjeta centro" style="margin-top:20px"><span class="sombrero">🎩</span>`;
  if (cerrado) h += `<h2>El Sombrero ya cerró</h2><p class="suave">El plazo terminó. No te preocupes: el organizador se encarga de que nadie se quede sin pareja.</p>`;
  else if (E.cfg.sombrero !== 'si') h += `<h2>El Sombrero está descansando</h2><p class="suave">Muy pronto empezará a proponer parejas. Mientras tanto, completa bien tu perfil para que acierte.</p>`;
  else h += `<h2>El Sombrero está pensando…</h2><p class="suave">En cuanto haya alguien compatible libre, te lo presentará aquí. ¡Vuelve en un rato!</p>
    <p class="tenue">Cuantas más cosas marques en tus intereses, mejor elige.</p>`;
  h += `</div><div class="centro"><button class="enlace" id="ya-tengo">En realidad ya tengo pareja</button></div>`;
  return h;
}

function bloqueTiene(E) {
  const s = E.solicitud_enviada;
  if (s) return `<div class="tarjeta centro" style="margin-top:20px"><div style="font-size:2.6rem">💌</div>
      <h2>Esperando a ${esc(s.persona.nombre)}</h2><p class="suave">Le pedimos que confirme que van juntos al baile. Cuando lo haga, aparecerá aquí.</p>
      <div class="pila" style="margin-top:12px"><button class="btn2" id="cambiar-pareja">Elegir a otra persona</button>
      <button class="enlace" id="cancelar-sol">Cancelar solicitud</button></div></div>
      <div class="centro"><button class="enlace" id="quiero-sombrero">Prefiero que el Sombrero me ayude</button></div>`;
  return `<div class="tarjeta centro" style="margin-top:20px"><div style="font-size:2.6rem">💃</div>
      <h2>¿Con quién vas al baile?</h2><p class="suave">Elige a tu pareja y le pediremos que lo confirme. Si todavía no se registra, vuelve cuando lo haga.</p>
      <div style="margin-top:12px"><button class="btn" id="cambiar-pareja">Elegir a mi pareja</button></div></div>
      <div class="centro"><button class="enlace" id="quiero-sombrero">Mejor que el Sombrero me ayude 🎩</button></div>`;
}

function bloquePareja(E) {
  const pa = E.pareja, p = pa.persona;
  const sinLeer = E.lechuzas.filter((l) => !l.leida && !l.cerrada).length;
  let h = `<div class="orla">Tu pareja para el baile</div>
    <div class="tarjeta oro" style="padding:10px">${carrusel(p, p.frase ? `<p style="margin-top:6px">${esc(p.frase)}</p>` : '')}
      <div style="padding:12px 6px 4px">
        ${pa.comunes.length ? `<h3>💞 Coinciden en</h3><div style="margin-top:8px">${chipsIntereses(pa.comunes, pa.comunes)}</div>` : ''}
        <div class="contador" id="cuenta-baile"></div>
        <button class="btn" id="lechuza">🦉 Mandarle una lechuza con un regalo</button>
      </div></div>`;
  h += `<div class="tarjeta" id="buzon"><div class="fila" style="align-items:center"><h3>📬 Tu buzón ${sinLeer ? `<span class="nuevo">${sinLeer} nueva${sinLeer > 1 ? 's' : ''}</span>` : ''}</h3>
    ${E.lechuzas.length ? `<button class="btn3" id="abrir-buzon" style="flex:0">${sinLeer ? 'Abrir' : 'Ver todo'}</button>` : ''}</div>
    ${E.lechuzas.length ? E.lechuzas.slice(0, 3).map(carta).join('') : `<p class="tenue">Todavía no tienes lechuzas. ¿Y si mandas tú la primera? 😉</p>`}
    ${E.enviadas.length ? `<p class="tenue" style="margin-top:8px">Has mandado ${E.enviadas.length} lechuza${E.enviadas.length > 1 ? 's' : ''} 🦉</p>` : ''}</div>`;
  return h;
}
function carta(l) {
  if (l.cerrada) return `<div class="carta"><span class="e">🎁</span><div><b>Sorpresa de ${esc(l.de)}</b>
    <p class="tenue">Se abre el día del baile ✨</p></div></div>`;
  const r = regalo(l.regalo);
  return `<div class="carta"><span class="e">${r.e}</span><div><b>${esc(r.n)}</b>${!l.leida ? '<span class="nuevo">nueva</span>' : ''}
    <div class="tenue">de ${esc(l.de)} · ${esc(fechaCorta(l.creada))}${l.sorpresa ? ' · 🎁 era sorpresa' : ''}</div>
    ${l.nota ? `<p class="nota">“${esc(l.nota)}”</p>` : ''}</div></div>`;
}

// ---- Acciones del inicio
function invitar() {
  const q = S.estado.propuesta;
  elegirRegalo({
    titulo: q.su_regalo ? `Aceptar a ${q.persona.nombre}` : `Invitar a ${q.persona.nombre}`,
    frases: q.su_regalo ? FRASES_ACEPTAR.concat(FRASES_INVITAR) : FRASES_INVITAR,
    boton: '🦉 Enviar mi lechuza',
    alEnviar: async (reg, nota) => {
      await accion({ accion: 'responder_propuesta', id: q.id, si: true, regalo: reg, nota });
      if (!S.estado.pareja) toast('¡Tu lechuza ya va volando! 🦉');
      pintarInicio();
    },
  });
}
async function rechazar() {
  const q = S.estado.propuesta;
  if (!confirm(`¿No quieres ir con ${q.persona.nombre}? No se lo diremos con tu nombre, y el Sombrero te buscará a otra persona.`)) return;
  try { await accion({ accion: 'responder_propuesta', id: q.id, si: false }, 'El Sombrero buscará a otra persona 🎩'); pintarInicio(); }
  catch (e) { toast(e.message, true); }
}
function mandarLechuza() {
  const E = S.estado;
  elegirRegalo({
    titulo: `Lechuza para ${E.pareja.persona.nombre}`,
    frases: FRASES_LECHUZA,
    conSorpresa: new Date(E.cfg.baile) > new Date(E.cfg.ahora),
    boton: '🦉 Enviar',
    alEnviar: async (reg, nota, sorpresa) => {
      await accion({ accion: 'lechuza', regalo: reg, nota, sorpresa }, sorpresa ? '🎁 Sorpresa enviada: la abrirá el día del baile' : '¡Lechuza enviada! 🦉');
      pintarInicio();
    },
  });
}
async function abrirBuzon() {
  const E = S.estado;
  const v = hoja(`<h2>📬 Tu buzón</h2><div style="margin-top:8px">${E.lechuzas.map(carta).join('')}</div>
    ${E.enviadas.length ? `<div class="orla">Lo que tú mandaste</div>${E.enviadas.map((l) => { const r = regalo(l.regalo); return `<div class="carta"><span class="e">${r.e}</span><div><b>${esc(r.n)}</b>
      <div class="tenue">${esc(fechaCorta(l.creada))}${l.sorpresa ? ' · 🎁 sorpresa' : ''}</div>${l.nota ? `<p class="nota">“${esc(l.nota)}”</p>` : ''}</div></div>`; }).join('')}` : ''}
    <div style="margin-top:14px"><button class="btn2" id="cerrar-buzon">Cerrar</button></div>`);
  $('#cerrar-buzon', v).addEventListener('click', () => { v.remove(); pintarInicio(); });
  if (E.lechuzas.some((l) => !l.leida && !l.cerrada)) { try { await accion({ accion: 'leer_lechuzas' }); } catch (e) {} }
}
async function elegirMiPareja() {
  let lista;
  try { lista = await api({ accion: 'nombres', token: S.token }); } catch (e) { return toast(e.message, true); }
  const libres = lista.filter((p) => p.estado !== 'pareja');
  const v = hoja(`<h2>¿Con quién vas al baile?</h2>
    <p class="suave">Le pediremos que lo confirme.</p>
    <input type="text" id="buscar" placeholder="Buscar nombre…" style="margin:10px 0">
    <div id="lista" class="pila" style="max-height:50vh;overflow:auto"></div>
    <div style="margin-top:12px"><button class="btn2" id="cancelar">Cancelar</button></div>`);
  const pintar = () => {
    const t = norm($('#buscar', v).value);
    const l = libres.filter((p) => !t || norm(p.nombre).includes(t));
    $('#lista', v).innerHTML = l.length ? l.map((p) => `<button class="opcion" style="text-align:left;display:flex;gap:10px;align-items:center" data-id="${p.id}">
      <span style="font-size:1.4rem">${casa(p.casa).e}</span><span style="flex:1">${esc(p.nombre)}</span></button>`).join('')
      : `<p class="tenue">No aparece. Si todavía no se registra, pídele que lo haga y vuelve aquí.</p>`;
    $('#lista', v).querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', async () => {
      try {
        await accion({ accion: 'pedir_pareja', para: +b.dataset.id });
        v.remove(); toast(S.estado.pareja ? '¡Pareja confirmada! 💃' : 'Le pedimos que lo confirme 💌'); pintarInicio();
      } catch (e) { toast(e.message, true); }
    }));
  };
  $('#buscar', v).addEventListener('input', pintar);
  $('#cancelar', v).addEventListener('click', () => v.remove());
  pintar();
}
async function celebrar(E) {
  const p = E.pareja.persona;
  const f = document.createElement('div');
  f.className = 'fiesta';
  f.innerHTML = `<div class="dentro">
    <p class="sub">✨ El Sombrero lo sabía ✨</p>
    <div class="duo"><div id="f1">${casa(E.yo.casa).e}</div><div id="f2">${casa(p.casa).e}</div></div>
    <h1 class="titulo" style="font-size:2rem">¡Tienen pareja!</h1>
    <p style="font-size:1.1rem;margin-top:10px">${esc(E.yo.nombre)} y ${esc(p.nombre)} irán juntos al Baile de Navidad 💃🕺</p>
    ${E.pareja.origen === 'sombrero' ? `<p class="suave">Los regalos de la invitación ya están en su buzón 📬</p>` : ''}
    <div style="margin-top:18px"><button class="btn" id="ok-fiesta">¡A bailar!</button></div></div>`;
  document.body.appendChild(f); confeti();
  const poner = async (id, persona) => { try { const l = await fotosDe(persona); if (l[0]) f.querySelector('#' + id).outerHTML = `<img src="${l[0]}" alt="">`; } catch (e) {} };
  poner('f1', E.yo); poner('f2', p);
  f.querySelector('#ok-fiesta').addEventListener('click', async () => {
    f.remove(); S.estado.pareja.nueva = false;
    try { await accion({ accion: 'visto', tipo: 'pareja' }); } catch (e) {}
    pintarInicio();
  });
}

// ====================================================================== Mi perfil
async function perfil() {
  pararSondeo();
  const E = S.estado, yo = E.yo;
  const P = { casa: yo.casa, soy: yo.soy, voy_con: yo.voy_con, frase: yo.frase, intereses: [...yo.intereses], fotos: [], vetos: [...E.vetos] };
  let fotosCambiadas = false;
  app.innerHTML = `<div class="cargando">Cargando tu perfil…</div>`;
  try { P.fotos = [...(await fotosDe(yo))]; } catch (e) {}
  let nombres = [];
  try { nombres = await api({ accion: 'nombres', token: S.token }); } catch (e) {}
  app.innerHTML = `
    <button class="enlace" id="volver">← Volver</button>
    <div class="tarjeta"><h2>Mi perfil</h2>
      <label class="campo">Mis fotos</label><div id="fe"></div>
      <label class="campo">Mi casa</label>
      <div class="opciones" id="casas">${CASAS.map((x) => `<button type="button" class="opcion casa-${x.id}" data-v="${x.id}" aria-pressed="${x.id === P.casa}"><span class="e">${x.e}</span>${x.id}</button>`).join('')}</div>
      <label class="campo">Soy…</label><div class="opciones" id="soy">${botonesOpcion(SOY, P.soy)}</div>
      <label class="campo">Me gustaría ir al baile…</label><div class="opciones" id="voy">${botonesOpcion(VOY, P.voy_con)}</div>
      <label class="campo" for="f">Mi frase</label><textarea id="f" maxlength="120">${esc(P.frase)}</textarea>
    </div>
    <div class="tarjeta"><h2>Lo que me gusta</h2><p class="tenue" id="cuenta-int"></p><div id="ei"></div></div>
    ${yo.estado !== 'pareja' ? `<div class="tarjeta"><h2>🤫 Prefiero no ir con…</h2>
      <p class="suave">Opcional y <b>secreto</b>: nadie se entera. El Sombrero nunca te presentará a estas personas (máximo 3).</p>
      <div class="chips" id="vetos" style="margin-top:10px"></div>
      <select id="nuevo-veto" style="margin-top:10px"><option value="">＋ Añadir a alguien</option>
        ${nombres.map((p) => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>` : ''}
    <div class="pila"><button class="btn" id="guardar">Guardar cambios</button></div>`;
  $('#volver').addEventListener('click', () => { pintarInicio(); sondear(); });
  editorFotos($('#fe'), P.fotos, () => (fotosCambiadas = true));
  activarOpciones($('#casas'), (v) => (P.casa = v));
  activarOpciones($('#soy'), (v) => (P.soy = v));
  activarOpciones($('#voy'), (v) => (P.voy_con = v));
  $('#f').addEventListener('input', (e) => (P.frase = e.target.value));
  const cuenta = () => ($('#cuenta-int').textContent = `Llevas ${P.intereses.length} ✓`);
  editorIntereses($('#ei'), P.intereses, (l) => { P.intereses = l; cuenta(); }); cuenta();
  const pintarVetos = () => {
    const c = $('#vetos'); if (!c) return;
    c.innerHTML = P.vetos.length ? P.vetos.map((id) => { const p = nombres.find((x) => x.id === id); return `<button type="button" class="chip" data-id="${id}">${esc(p ? p.nombre : '¿?')} ✕</button>`; }).join('') : '<span class="tenue">Nadie</span>';
    c.querySelectorAll('[data-id]').forEach((b) => b.addEventListener('click', () => { P.vetos = P.vetos.filter((x) => x !== +b.dataset.id); pintarVetos(); }));
  };
  pintarVetos();
  if ($('#nuevo-veto')) $('#nuevo-veto').addEventListener('change', (e) => {
    const id = +e.target.value; e.target.value = '';
    if (!id || P.vetos.includes(id)) return;
    if (P.vetos.length >= 3) return toast('Máximo 3 personas', true);
    P.vetos.push(id); pintarVetos();
  });
  $('#guardar').addEventListener('click', async () => {
    if (yo.estado === 'busca' && P.intereses.length < MIN_INTERESES) return toast(`Elige al menos ${MIN_INTERESES} cosas que te gusten`, true);
    if (yo.estado === 'busca' && !P.fotos.length) return toast('Necesitas al menos una foto mientras buscas pareja', true);
    const btn = $('#guardar'); btn.disabled = true;
    try {
      const datos = { accion: 'perfil', casa: P.casa, soy: P.soy, voy_con: P.voy_con, frase: P.frase, intereses: P.intereses };
      if (fotosCambiadas) datos.fotos = P.fotos;
      await accion(datos);
      if (yo.estado !== 'pareja' && JSON.stringify([...P.vetos].sort()) !== JSON.stringify([...E.vetos].sort())) await accion({ accion: 'vetos', ids: P.vetos });
      toast('Perfil guardado ✓'); pintarInicio(); sondear();
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  });
}

// ====================================================================== Administración (#admin)
async function admin() {
  pararSondeo();
  let clave = (() => { try { return sessionStorage.getItem('baile_admin') || ''; } catch (e) { return ''; } })();
  const pedir = () => {
    app.innerHTML = `<div class="tarjeta"><h2>🔑 Administración</h2>
      <label class="campo" for="c">Clave</label><input type="password" id="c">
      <div style="margin-top:14px"><button class="btn" id="ok">Entrar</button></div></div>
      <div class="centro"><button class="enlace" id="volver">← Ir al baile</button></div>`;
    $('#volver').addEventListener('click', () => { location.hash = ''; arrancar(); });
    const ir = () => { clave = $('#c').value; cargar({ accion: 'admin_panel' }); };
    $('#ok').addEventListener('click', ir);
    $('#c').addEventListener('keydown', (e) => { if (e.key === 'Enter') ir(); });
  };
  async function cargar(p) {
    try {
      const d = await api({ ...p, clave });
      try { sessionStorage.setItem('baile_admin', clave); } catch (e) {}
      pintar(d);
    } catch (e) { toast(e.message, true); if (/clave/i.test(e.message)) pedir(); }
  }
  function pintar(d) {
    const libres = d.personas.filter((x) => x.estado !== 'pareja');
    const n = (est) => d.personas.filter((x) => x.estado === est).length;
    const ETQ = { busca: 'busca pareja', tiene: 'dice que tiene', pareja: 'con pareja' };
    app.innerHTML = `
      <div class="fila" style="align-items:center"><h2>🔑 Administración</h2><button class="btn3" id="refrescar" style="flex:0">↻</button></div>
      <div class="cifras" style="margin-top:12px"><div><b>${d.personas.length}</b><span>registrados</span></div><div><b>${d.parejas.length}</b><span>parejas</span></div>
        <div><b>${n('busca')}</b><span>buscando</span></div><div><b>${n('tiene')}</b><span>esperando confirmar</span></div></div>
      <div class="tarjeta">
        <label class="interruptor"><input type="checkbox" id="somb" ${d.sombrero === 'si' ? 'checked' : ''}> 🎩 El Sombrero propone parejas</label>
        <p class="tenue">Plazo hasta el ${esc(fecha(d.cierre))}. Cada propuesta caduca a las ${d.horas} h si alguien no responde. ${d.lechuzas} lechuzas enviadas.</p>
      </div>
      <div class="tarjeta"><h3>Emparejar a mano</h3>
        <p class="tenue">Para que nadie se quede sin pareja al final.</p>
        <div class="fila" style="margin-top:8px">
          <select id="ea"><option value="">Persona 1</option>${libres.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select>
          <select id="eb"><option value="">Persona 2</option>${libres.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select>
        </div>
        <div style="margin-top:10px"><button class="btn2" id="emparejar">Emparejar</button></div></div>
      <div class="tarjeta"><h3>Parejas (${d.parejas.length})</h3>
        ${d.parejas.map((pa) => `<div class="admin-persona fila" style="align-items:center"><span style="flex:3">💃 ${esc(pa.a)} &amp; ${esc(pa.b)}
          <span class="tenue">· ${pa.origen === 'sombrero' ? '🎩 Sombrero' : pa.origen === 'admin' ? '🔑 a mano' : 'ya iban juntos'}</span></span>
          <button class="btn3 peligro" style="flex:0" data-deshacer="${pa.id}">Deshacer</button></div>`).join('') || '<p class="tenue">Ninguna todavía</p>'}</div>
      <div class="tarjeta"><h3>Personas (${d.personas.length})</h3>
        ${d.personas.map((x) => `<div class="admin-persona">
          <b>${esc(x.nombre)}</b> ${insignia(x.casa)} <span class="estado e-${x.estado}">${ETQ[x.estado]}</span>
          <div class="tenue">${x.soy} → ${x.voy_con} · ${x.fotos} foto${x.fotos === 1 ? '' : 's'} · ${x.intereses} intereses
            ${x.propuesta_con ? ` · 🎩 propuesta con <b>${esc(x.propuesta_con)}</b>` : ''}${x.rechazos ? ` · ${x.rechazos} “no”` : ''}</div>
          <div class="acc"><button class="btn3" data-pin="${x.id}" data-n="${esc(x.nombre)}">Cambiar PIN</button>
          <button class="btn3 peligro" data-borrar="${x.id}" data-n="${esc(x.nombre)}">Borrar</button></div></div>`).join('') || '<p class="tenue">Nadie todavía</p>'}</div>
      <div class="centro"><button class="enlace" id="volver">← Ir al baile</button></div>`;
    $('#refrescar').addEventListener('click', () => cargar({ accion: 'admin_panel' }));
    $('#volver').addEventListener('click', () => { location.hash = ''; arrancar(); });
    $('#somb').addEventListener('change', (e) => cargar({ accion: 'admin_sombrero', abierto: e.target.checked }));
    $('#emparejar').addEventListener('click', () => {
      const a = +$('#ea').value, b = +$('#eb').value;
      if (!a || !b) return toast('Elige a las dos personas', true);
      cargar({ accion: 'admin_emparejar', a, b });
    });
    app.querySelectorAll('[data-deshacer]').forEach((b) => b.addEventListener('click', () => {
      if (confirm('¿Deshacer esta pareja? Los dos volverán a buscar pareja.')) cargar({ accion: 'admin_deshacer', pareja: +b.dataset.deshacer });
    }));
    app.querySelectorAll('[data-borrar]').forEach((b) => b.addEventListener('click', () => {
      if (confirm(`¿Borrar a ${b.dataset.n} y todo lo suyo? No se puede deshacer.`)) cargar({ accion: 'admin_borrar', persona: +b.dataset.borrar });
    }));
    app.querySelectorAll('[data-pin]').forEach((b) => b.addEventListener('click', () => {
      const pin = prompt(`Nuevo PIN de 4 números para ${b.dataset.n}:`);
      if (pin) cargar({ accion: 'admin_pin', persona: +b.dataset.pin, pin: pin.trim() });
    }));
  }
  if (clave) cargar({ accion: 'admin_panel' }); else pedir();
}

// ====================================================================== Arranque
function arrancar() {
  if (location.hash === '#admin') return admin();
  if (S.token && CFG.url) return inicio();
  portada();
}
window.addEventListener('hashchange', arrancar);
arrancar();
</script>
</body>
</html>
